<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
            <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Admin login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        .custom-bg{
            background-color: #2ec1ac;
        }
        .custom-bg:hover{
            background-color: #276e8c;
        }
    </style>
</head>


<body class="bg-light">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form>
                <div class="modal-header">
                    <h5 class="modal-title d-flex align-item-center">
                    <i class="bi bi-person-lines-fill fs-3 me-3"></i>user registration
                    </h5>
                    </div>
                <div class="modal-body">
                <span class="badge bg-light text-dark mb-3 text-wrap lh-base">
                    note:your details must match with your ID(driving license)
                    it will be required during booking.And user must be 18+.
                </span>
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-6 ps-0 mb-3">
                            <label class="form-label">name</label>
                            <input type="text" class="form-control shadow-none" >
                        </div>
                        <div class="col-md-6 p-0 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control shadow-none" >
                        </div> 
                        <div class="col-md-6 ps-0 mb-3">
                            <label class="form-label">phone number</label>
                            <input type="number" maxlength="10" pattern="\d{10}"
                            title="Enter a 10-digit phone number" placeholder="1234567890" 
                            required class="form-control shadow-none" >
                        </div>
                        <div class="col-md-6 p-0 mb-3">
                            <label class="form-label">picture</label>
                            <input type="file" class="form-control shadow-none" >
                        </div>
                        <div class="col-md-12 p-0 mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control shadow-none" rows="1"></textarea>
                        </div>
                        <div class="col-md-6 ps-0 mb-3">
                            <label class="form-label">pincode</label>
                            <input type="number" class="form-control shadow-none" >
                        </div>
                        <div class="col-md-6 ps-0 mb-3">
                            <label class="form-label">driving liencse</label>
                            <input type="file" class="form-control shadow-none" >
                        </div>
                        <div class="col-md-6 ps-0 mb-3">
                            <label class="form-label">password</label>
                            <input type="password" class="form-control shadow-none" >
                        </div>
                        <div class="col-md-6 p-0 mb-3">
                            <label class="form-label">conform password</label>
                            <input type="password" class="form-control shadow-none" >
                        </div>
                        
                    </div>
                    <div class="tect-center my-1">
                    <button type="submit" class="btn btn-dark shadow-none]=" ><a href="h.html" style="color: inherit; text-decoration: none;  ">Register</a></button>
                </div>
                </div>
                </div>
            </form>
        </div>
    </div>
</div>

    
</body>
</html>
